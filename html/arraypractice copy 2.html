<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소프트웨어 동아리</title>
</head>
<style>
    .container {
        display: flex;
        height: 100vh;
    }

    .menu {
        width: 220px;
        background-color: #eeeeee;
        padding: 20px;
    }

    .content {
        flex: 1;
        padding: 40px;
    }

    .schedule {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }

    .schedule th,
    .schedule td {
        border: 1px solid #cccccc;
        padding: 12px;
        text-align: center;
    }

    .schedule th {
        background-color: #eeeeee;
    }


    img {
        width: 150px;
        height: 150px;
        object-fit: cover;
    }
    #output {
        height: 100px;
    }
</style>

<body>


    <input id = "input"><button id = "submit">제출</button>
    <div id = "output">
        <ul id = "list"></ul>
    </div>
     
</body>
<script>
    
    document.getElementById("submit").addEventListener("click", ()=>{ 
        function stringToHtml(str){
            const template = document.createElement("template");
            template.innerHTML = str.trim   ();
            return template.content.firstChild;
        }

        
        
        let value = document.getElementById("input").value;
        let arr = value.split(",");
        let arr1 = [];  
        arr.forEach(
            function(value, i){
                 document.getElementById("list").appendChild(stringToHtml("<li>" + value.trim() + "</li>"));
            }
            
        
    
    
    )
})

</script>
</html>
