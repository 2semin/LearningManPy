        }else{
        return value *2
        }
    }
); //map 사용시 리턴값이 있어야한다. 리턴값이 없으면 undefined가 들어간다. arr2 는 [12, 6, 20, 22, 154, 146] 이 된다.
console.log(arr2);

 //map 사용시 리턴값이 있어야한다. 리턴값이 없으면 undefined가 들어간다. arr3 는 [12, 6, 20, 22, 154, 146] 이 된다.
