<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>자바스크립트 챗봇</h2>
    <div id = "chat-bot">
        <div id ="chat-box">
            챗봇: 안녕하세요! 무엇을 도와드릴까요?
        </div>
    </div>
    <input type = "text" id = "input" 
        placeholder="메시지를 입력하세요.">
    <button id = "send">전송</button>
    <script>
        const $input = document.getElementById('input');
        const $send = document.getElementById('send');
        const $ChatBox = document.getElementById('chat-box');
        function makeAnswer(question){
            if(question.includes('안녕')){
                return '안녕하세요! 반갑습니다';
            }
            else if(question.includes('날씨')){
                return '오늘은 첫눈이 내렸어요. 좋은 하루 보내세요!';
            }
            else if(question.includes('고마워')){
                return '천만에요! 언제든지 물어보세요.';
            }
            else{
                return '죄송합니다. 무슨 뜻인지 잘 모르겠어요.';
            }
        }
        function addMessage(text){
            const div = document.createElement('div');
            div.textContent = text;
            $ChatBox.appendChild(div);
        }
        function sendMessage(){
            const question = $input.value.trim();
            if(question === '') return;
            addMessage(`사용자 : ${question}`);
            const answer = makeAnswer(question);
            addMessage(`챗봇 : ${answer}`);
            $input.value = '';
            $input.focus();
        }
        $send.addEventListener('click', sendMessage);
        $input.addEventListener('keydown', function(e){
            if(e.key ==='Enter'){
                sendMessage();
            }
        });
    </script>
</body>
</html>
